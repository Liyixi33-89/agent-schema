server {
# HTTPS-RESERVED (2026-11-03): add 443 server block + TLS cert when domain ready.
# Also add proxy_set_header X-Forwarded-Proto https to /api/ and enable trusted-proxy.
# Secure cookie attribute is tightened by backend based on X-Forwarded-Proto.
    listen 80;
    server_name 111.231.57.177;
    root /opt/schema/current/web;
    index index.html;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Acceptance surface: /accept/api/ proxies to isolated backend on 18081.
    # Static blocks use alias with trailing slash on BOTH location and alias,
    # and try_files without URI fallback (URI fallback re-matches same location and loops).
    location ^~ /accept/api/ {
        rewrite ^/accept(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /accept/;
        # TEMPORARY HTTP acceptance only; remove nosecure when enabling TLS.
        proxy_cookie_flags ~^schema_(at|rt|csrf)$ nosecure;
    }
    location ^~ /accept/designer/ {
        alias /opt/schema/staging/accept/current/web/designer/;
        index index.html;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self' blob:" always;
        try_files $uri $uri/ =404;
    }
    location ^~ /accept/runtime/ {
        alias /opt/schema/staging/accept/current/web/runtime/;
        index index.html;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self' blob:" always;
        try_files $uri $uri/ =404;
    }
    location ^~ /accept/admin/ {
        alias /opt/schema/staging/accept/current/web/admin/;
        index index.html;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self' blob:" always;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # 生产 runtime（vite base='/runtime/'）：产物 assets 统一落在 web/assets/，
    # 必须把 /runtime/assets/* 映回 /assets/*，否则根入口 JS/CSS 全 404。
    # ⚠️ 这是既有缺陷修复：此前缺本块，导致生产前端白屏（2026-11-25 定位）。
    location ^~ /runtime/assets/ {
        rewrite ^/runtime(/assets/.*)$ $1 break;
        expires 30d;
        try_files $uri =404;
    }
    location ^~ /runtime/ {
        try_files $uri $uri/ /index.html;
    }

    # designer（vite base='/designer/'）：产物 assets 统一落在 web/assets/，
    # 必须把 /designer/assets/* 映回 /assets/*，否则入口 JS/CSS 全 404。
    location ^~ /designer/assets/ {
        rewrite ^/designer(/assets/.*)$ $1 break;
        expires 30d;
        try_files $uri =404;
    }
    location /designer/ {
        try_files $uri $uri/ /designer/index.html;
    }
    # admin（vite base='/admin/'）：同上，/admin/assets/* 映回 /assets/*。
    location ^~ /admin/assets/ {
        rewrite ^/admin(/assets/.*)$ $1 break;
        expires 30d;
        try_files $uri =404;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /assets/ {
        expires 30d;
        try_files $uri =404;
    }
    location ~ /index\.html$ {
        add_header Cache-Control no-cache;
    }
    location ~ /\. {
        deny all;
    }
}