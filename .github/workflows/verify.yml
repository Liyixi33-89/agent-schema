name: verify

# CI 独立审计层：AI 说「验证通过」是自我报告；Actions 绿勾是 GitHub 的独立记录。
# 本地 Windows/PowerShell，CI 是 Linux/pwsh——跨平台同一份脚本正是为这层写的。
# 团队协作启动时（操作项，不在代码库生效）：Settings → Branches → Branch protection
#   → Require status checks: 勾选本 job 的 check（verify / verify）→ 即升级为事前门禁。
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install frontend dependencies
        working-directory: schema-frontend
        run: pnpm install --frozen-lockfile

      # 与本地跑同一份脚本、同一套检查——AI 代码与人写代码无豁免通道
      - name: Run verify pipeline (commit level)
        shell: pwsh
        run: ./scripts/verify.ps1 -Level commit

      # 度量上报（可选）：verify-log 由脚本写入 .agent/metrics/（gitignore，仅存档于 artifact）
      - name: Archive verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: .agent/metrics/verify-log.jsonl
          if-no-files-found: ignore
          retention-days: 30
