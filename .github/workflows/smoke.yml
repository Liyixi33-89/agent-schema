name: smoke

# 浏览器冒烟（CDP 驱动，非 Playwright）——独立测试栈，不连公网业务库。
#
# 分层原则（AGENTS.md §8 / 测试文档 00）：
#   - 每次 PR：类型/架构/契约/单测/IT/最小浏览器冒烟（本工作流）
#   - 发布候选：完整业务/安全/权限/发布快照（专项验收，另行触发）
#   - 可靠性验收：压测/恢复/故障/告警（隔离环境 + 批准窗口）
#
# 环境前提显式声明：
#   - 本轮自起后端（18080）+ 独立 PG（schema_dev）+ 前端静态产物（nginx 或 vite preview）
#   - 不使用 --unsafely-treat-insecure-origin-as-secure 掩盖部署认证问题
#     （本地回环 HTTP 下 Secure Cookie 由后端按 X-Forwarded-Proto 判定，见 SessionCookies）
#
# ⚠️ 必须包含 push 到主干：只有 pull_request 时，合并后的 master 从未实跑过冒烟，
#    「PR 绿」不等于「合并版本绿」。push 触发保证每个 master 提交都有可追溯的冒烟结果。
on:
  pull_request:
  push:
    branches: [main, master, test]
  workflow_dispatch:

concurrency:
  # PR 按 ref 隔离（不同 PR 不互相取消）；master 串行（同一提交不重复跑）
  group: smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: schema_dev
          POSTGRES_USER: schema_dev
          POSTGRES_PASSWORD: schema_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_dev -d schema_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install frontend dependencies
        working-directory: schema-frontend
        run: pnpm install --frozen-lockfile

      # Playwright 的 Chromium：--with-deps 装齐 Linux 运行所需系统库
      # （CDP 日常双跑已移除，故不再单独探测/安装系统 google-chrome）
      - name: Install Playwright Chromium
        working-directory: schema-frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install build-worker dependencies
        working-directory: schema-platform/build-module/node
        run: npm ci --no-fund --no-audit

      # 构建后端 jar + 三前端产物（验收面 base，与生产同构）
      - name: Build backend
        working-directory: schema-platform
        run: mvn -q -pl bootstrap -am package -DskipTests

      - name: Build frontend
        working-directory: schema-frontend
        run: pnpm run build

      # 起后端（独立 PG，Flyway 自动建表 + 种子数据）
      - name: Start backend
        run: |
          cd schema-platform
          nohup java -jar bootstrap/target/bootstrap-0.1.0-SNAPSHOT.jar \
            --server.port=18080 \
            --spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/schema_dev \
            --spring.datasource.username=schema_dev \
            --spring.datasource.password=schema_local_only \
            > /tmp/backend.log 2>&1 &
          echo "backend pid=$!"
          for i in $(seq 1 60); do
            sleep 3
            if curl -sf -m 3 http://127.0.0.1:18080/internal/health/readiness >/dev/null 2>&1; then
              echo "READY after $((i*3))s"
              curl -s http://127.0.0.1:18080/internal/health/readiness
              exit 0
            fi
          done
          echo "后端未就绪——日志尾部："
          tail -50 /tmp/backend.log
          exit 1

      # 播种冒烟账号：Flyway 只建种子角色，不建用户（V6 的 INSERT 是角色绑定占位）。
      # 这里直接写库创建 accept_admin + platform_admin(org:manage) + seed_data_admin，
      # 密码哈希复用验收面已验证的 BCrypt 值（Accept!2026）。
      # 不依赖外部密钥：CI 是一次性独立库，仅本 job 生命周期内存在。
      - name: Seed smoke admin account
        env:
          PGPASSWORD: schema_local_only
        run: |
          psql -h 127.0.0.1 -U schema_dev -d schema_dev -v ON_ERROR_STOP=1 <<'SQL'
          -- 复用验收库同款 BCrypt 哈希（对应 Accept!2026，已线上验证可登录）；仅 CI 一次性库使用
          INSERT INTO sys_user (tenant_id, account, name, password_hash, status, must_change_password)
          VALUES (1, 'accept_admin', '冒烟管理员',
                  '$2a$10$CAgE4a5dLLQpfI24xrY8s.sNVMZFbwCuHXdhDDdSBdanv1LGJNMVm',
                  'ACTIVE', false)
          ON CONFLICT DO NOTHING;

          INSERT INTO sys_role (tenant_id, app_id, code, name, role_type)
          VALUES (1, NULL, 'platform_admin', '平台管理员', 'TENANT')
          ON CONFLICT DO NOTHING;

          INSERT INTO sys_role_permission (role_id, resource_type, resource_id, action)
          SELECT id, 'ACTION', 0, 'org:manage' FROM sys_role
           WHERE tenant_id=1 AND code='platform_admin'
          ON CONFLICT DO NOTHING;

          INSERT INTO sys_user_role (user_id, role_id)
          SELECT u.id, r.id FROM sys_user u, sys_role r
           WHERE u.account='accept_admin' AND r.tenant_id=1
             AND r.code IN ('platform_admin','seed_data_admin')
          ON CONFLICT DO NOTHING;
          SQL
          echo "--- seeded ---"
          psql -h 127.0.0.1 -U schema_dev -d schema_dev -t -A \
            -c "SELECT ur.user_id, r.code FROM sys_user_role ur JOIN sys_role r ON r.id=ur.role_id ORDER BY 1,2;"

      # 播种冒烟应用：必须走 API 而非直写表——create 内部会 initDefaultRoles
      # （app_admin/developer/user 三角色）+ grantCreatorAdmin（创建者自动 app_admin），
      # 手写 SQL 极易漏建角色导致卡片墙/导航为空。
      - name: Seed smoke app via API
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:18080
          # ⚠️ CsrfFilter 校验 Origin 精确匹配或命中 DEV_ORIGINS
          #    （http://127.0.0.1:5173/5174/5175）。种子脚本不是浏览器，
          #    需显式带上被放行的 Origin，否则 CSRF_ORIGIN_REJECTED。
          ORIGIN=http://127.0.0.1:5173
          JAR=/tmp/smoke-cookies.txt
          rm -f "$JAR"
          # 1) 匿名 CSRF
          curl -sf -c "$JAR" -H "Origin: $ORIGIN" "$BASE/api/auth/csrf" >/dev/null
          CSRF=$(awk '/schema_csrf/{print $7}' "$JAR")
          # 2) 登录
          curl -sf -b "$JAR" -c "$JAR" -X POST "$BASE/api/auth/login" \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            -H "X-CSRF-Token: $CSRF" \
            -d '{"username":"accept_admin","password":"Accept!2026"}' >/dev/null
          CSRF=$(awk '/schema_csrf/{print $7}' "$JAR")
          # 3) 建应用（幂等：已存在则复用）
          CODE=$(curl -s -o /tmp/app-create.json -w '%{http_code}' \
            -b "$JAR" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" \
            -X POST "$BASE/api/apps" \
            -d '{"name":"冒烟验收应用","description":"CI 浏览器冒烟用"}')
          echo "create app -> $CODE $(cat /tmp/app-create.json)"

          # 4) 按「创建返回的目标 ID」核对，而不是只看列表非空。
          #    只看非空会掩盖两类误判：应用早存在（幂等命中旧数据）、
          #    或建出来的是别的应用（列表有内容但目标缺失）。
          APPS=$(curl -sf -b "$JAR" -H "Origin: $ORIGIN" "$BASE/api/apps?keyword=")
          echo "apps -> $APPS"
          export CREATED_JSON="$(cat /tmp/app-create.json 2>/dev/null || echo '')"

          # 5) 取目标 ID（创建返回优先，否则按名称从列表回查）→ 在列表中定位 →
          #    读其 myRole（卡片墙可见性前提）。输出 TARGET_ID= 与 RESULT= 两行。
          #    ⚠️ 不能用 `printf | python3 - <<'PY'`：heredoc 与管道争抢 stdin。
          #    改为把 JSON 写文件 + 路径作参数传给脚本，stdin 留给解释器。
          printf '%s' "$APPS" > /tmp/smoke-apps.json
          VERDICT=$(python3 - /tmp/smoke-apps.json <<'PY'
          import json, os, sys
          path = sys.argv[1]
          created = os.environ.get("CREATED_JSON", "")
          try:
              with open(path, encoding="utf-8") as f:
                  d = json.load(f)
          except Exception:
              print("TARGET_ID=")
              print("RESULT=MISSING roles=<bad-json>")
              raise SystemExit(0)
          lst = d.get("list", [])
          target = None
          if created:
              try:
                  target = json.loads(created).get("appId")
              except Exception:
                  target = None
          if target is None:
              for a in lst:
                  if a.get("name") == "冒烟验收应用":
                      target = a.get("id")
                      break
          if target is None:
              print("TARGET_ID=")
              print("RESULT=MISSING roles=<no-target>")
              raise SystemExit(0)
          for a in lst:
              if str(a.get("id")) == str(target):
                  roles = a.get("myRole") or []
                  print("TARGET_ID=%s" % target)
                  print("RESULT=FOUND roles=%s" % (",".join(roles) if roles else "<empty>"))
                  break
          else:
              print("TARGET_ID=%s" % target)
              print("RESULT=MISSING roles=<not-in-list>")
          PY
          )
          echo "$VERDICT"
          TARGET_ID=$(printf '%s' "$VERDICT" | sed -n 's/^TARGET_ID=//p')
          VERIFY_LINE=$(printf '%s' "$VERDICT" | sed -n 's/^RESULT=//p')
          [ -n "$TARGET_ID" ] || { echo "种子应用创建失败：未能确定目标应用 ID"; exit 1; }
          case "$VERIFY_LINE" in
            FOUND*) echo "SMOKE_TARGET_APP_ID=$TARGET_ID" >> "$GITHUB_ENV" ;;
            *) echo "种子应用校验失败：目标 ID=$TARGET_ID 不在列表中（$VERIFY_LINE）"; exit 1 ;;
          esac

          # 6) 建一张最小页面并发布——runtime 断言依赖「真实已发布页面」，
          #    不能用已有页面或「容器就绪」占位文案替代，否则会把
          #    「壳正常、业务没加载」误判为通过。
          TS=$(date +%s)
          PAGE_TITLE="E2E唯一标题_$TS"
          APP_NAME_FULL=$(printf '%s' "$APPS" | python3 - "$TARGET_ID" <<'PY'
          import json, sys
          target = str(sys.argv[1])
          d = json.load(open('/tmp/smoke-apps.json', encoding='utf-8'))
          for a in d.get('list', []):
              if str(a.get('id')) == target:
                  print(a.get('name', ''))
                  break
          PY
          )

          PAGE_RESP=$(curl -s -b "$JAR" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
            -H "X-CSRF-Token: $(awk '/schema_csrf/{print $7}' "$JAR")" \
            -X POST "$BASE/api/pages" \
            -d "{\"appId\":$TARGET_ID,\"pageKey\":\"smoke_$TS\",\"name\":\"冒烟页$TS\",\"type\":\"DASHBOARD\",\"path\":\"/smoke_$TS\"}")
          echo "page -> $PAGE_RESP"
          PAGE_ID=$(printf '%s' "$PAGE_RESP" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("id") or d.get("pageId") or "")')
          PAGE_DRAFT_VER=$(printf '%s' "$PAGE_RESP" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("draftVersion") or 1)')
          [ -n "$PAGE_ID" ] || { echo "种子页面创建失败"; exit 1; }

          # 7) 写草稿：必须带 baseDraftVersion（建页返回的 draftVersion），
          #    否则后端 400 VALIDATION_FAILED「数值字段缺失或非法」
          DRAFT_BODY=$(python3 - "$PAGE_TITLE" "$PAGE_DRAFT_VER" "$TS" <<'PY'
          import json, sys
          title, ver, ts = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          # path 必须唯一：页面路由有唯一约束（重复会 422 PATH_DUPLICATED）。
          # type 用 DASHBOARD：FormPageHost 明确允许 DASHBOARD 不绑定 modelId
          #   （FormPageHost.tsx:66「DASHBOARD 页模型可空」）；
          #   FORM/LIST/DETAIL 缺 modelId 会报「页面未绑定数据模型」，页面渲染不出内容。
          schema = {
              "id": "smoke_page", "pageKey": "smoke", "name": "冒烟页",
              "type": "DASHBOARD", "path": "/smoke_%s" % ts,
              "layout": [{"id": "n1", "componentName": "LabelText",
                          "props": {"label": title}}],
              "actions": [], "schemaVersion": 1,
          }
          print(json.dumps({"schema": schema, "baseDraftVersion": ver}, ensure_ascii=False))
          PY
          )
          DRAFT_CODE=$(curl -s -o /tmp/draft.json -w '%{http_code}' \
            -b "$JAR" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
            -H "X-CSRF-Token: $(awk '/schema_csrf/{print $7}' "$JAR")" \
            -X PUT "$BASE/api/pages/$PAGE_ID/draft" -d "$DRAFT_BODY")
          echo "draft -> $DRAFT_CODE $(head -c 200 /tmp/draft.json)"
          [ "$DRAFT_CODE" = "200" ] || { echo "种子页面草稿写入失败"; exit 1; }

          # 8) 发布
          PUB_CODE=$(curl -s -o /tmp/pub.json -w '%{http_code}' \
            -b "$JAR" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
            -H "X-CSRF-Token: $(awk '/schema_csrf/{print $7}' "$JAR")" \
            -X POST "$BASE/api/apps/$TARGET_ID/publish" -d '{}')
          echo "publish -> $PUB_CODE $(head -c 200 /tmp/pub.json)"
          [ "$PUB_CODE" = "200" ] || { echo "种子页面发布失败"; exit 1; }

          # 9) 核对运行时通道确实能读到这页（与 runtime 同源接口）
          RT_CODE=$(curl -s -o /tmp/rt-page.json -w '%{http_code}' \
            -b "$JAR" -H "Origin: $ORIGIN" "$BASE/api/runtime/pages/$PAGE_ID")
          echo "runtime page -> $RT_CODE"
          [ "$RT_CODE" = "200" ] || { echo "种子页面运行时读取失败"; exit 1; }
          grep -q "$PAGE_TITLE" /tmp/rt-page.json \
            || { echo "种子页面已发布但不含唯一标题（运行时读到的不是本轮内容）"; exit 1; }

          # 10) 测试元数据（不含凭据）
          python3 - "$TARGET_ID" "$APP_NAME_FULL" "$PAGE_ID" "$PAGE_TITLE" > /tmp/smoke-meta.json <<'PY'
          import json, sys
          app_id, app_name, page_id, title = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          print(json.dumps({
              "appId": int(app_id), "appName": app_name,
              "pageId": int(page_id), "pageTitle": title,
          }, ensure_ascii=False, indent=2))
          PY
          echo "--- smoke-meta.json ---"
          cat /tmp/smoke-meta.json
          echo "SMOKE_META_FILE=/tmp/smoke-meta.json" >> "$GITHUB_ENV"

      # 起前端静态服务（vite preview，三应用各自端口）
      # ⚠️ 三应用 base 分别是 /designer/ /runtime/ /admin/——探测路径必须带 base，
      #    访问根 / 会 404（vite preview 不做 base 重写）。
      # ⚠️ 必须显式 --host 127.0.0.1：
      #    vite preview 默认绑定 localhost，在 GitHub Actions 上常解析为 ::1（仅 IPv6），
      #    curl 127.0.0.1 连不上（实测日志显示 Local: http://localhost:5173/designer/ 已就绪，
      #    但 IPv4 探测全部 FAIL）。显式绑定 IPv4 后探测与浏览器访问都稳定。
      # 注意：不使用 `set -- $spec` 拆参数（会污染位置参数，导致 vite 收到 "-2" 等杂散参数）。
      - name: Start frontend preview
        working-directory: schema-frontend
        run: |
          # ⚠️ pnpm exec 需用 -- 分隔自身参数与传给 vite 的参数，
          #    否则 --port 被 pnpm 吞掉/错传，vite 收到杂散参数报 "unexpected argument"。
          nohup pnpm --filter @schema/designer exec -- vite preview --host 127.0.0.1 --port 5173 --strictPort \
            > /tmp/preview-designer.log 2>&1 &
          nohup pnpm --filter @schema/runtime exec -- vite preview --host 127.0.0.1 --port 5174 --strictPort \
            > /tmp/preview-runtime.log 2>&1 &
          nohup pnpm --filter @schema/admin-console exec -- vite preview --host 127.0.0.1 --port 5175 --strictPort \
            > /tmp/preview-admin.log 2>&1 &
          # 轮询就绪（最多 60s）：不依赖固定 sleep，慢机器也能过
          ok=1
          for pair in "5173:/designer/" "5174:/runtime/" "5175:/admin/"; do
            p="${pair%%:*}"
            b="${pair#*:}"
            ready=0
            for i in $(seq 1 30); do
              if curl -sf -m 3 "http://127.0.0.1:${p}${b}" >/dev/null; then
                echo "port ${p}${b} OK (${i}s)"
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "port ${p}${b} FAIL after 60s"
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "--- preview logs ---"
            for f in /tmp/preview-designer.log /tmp/preview-runtime.log /tmp/preview-admin.log; do
              echo "== $f =="; tail -25 "$f" || true
            done
            echo "--- listening ports ---"
            ss -lntp 2>/dev/null | grep -E ':(5173|5174|5175) ' || echo '(none)'
            exit 1
          fi

      # ---------------------------------------------------------------
      # 日常浏览器冒烟（Playwright / Chromium）——唯一必过入口
      #
      # PR 2 起本步骤即门禁：
      #  - 不再是 continue-on-error（失败必须让 job 变红）
      #  - 前置：隔离 PG + 后端 + 种子元数据 + Vite preview 已就绪
      #  - 缺失前置（元数据/地址）时 setup 抛错，直接失败——
      #    不静默跳过，也不回退到公网
      #
      # 三条必跑场景（各证真实业务行为，见 e2e/*.smoke.spec.ts）：
      #   SMK-DES-01 真实登录 → 卡片墙找到本轮创建的应用
      #   SMK-RUN-01 打开本轮已发布页面 → 布局真实渲染（两级断言）
      #   SMK-ADM-01 健康页指标与 overview 响应数值一致
      #
      # 旧的 CDP 日常双跑已移除；scripts/acceptance 下的 CDP 脚本保留，
      # 供专项验收继续使用。
      # ---------------------------------------------------------------
      - name: Run Playwright smoke (required)
        id: pw
        working-directory: schema-frontend
        env:
          SMOKE_DESIGNER_BASE: http://127.0.0.1:5173/designer
          SMOKE_RUNTIME_BASE: http://127.0.0.1:5174/runtime
          SMOKE_ADMIN_BASE: http://127.0.0.1:5175/admin
          SMOKE_META_FILE: /tmp/smoke-meta.json
          SMOKE_USERNAME: accept_admin
          SMOKE_PASSWORD: ${{ secrets.SMOKE_ACCEPT_PASSWORD || 'Accept!2026' }}
          CI: 'true'
        run: |
          set -o pipefail
          # 前置显式校验：缺失即失败（不静默跳过、不回退公网）
          [ -f "${SMOKE_META_FILE}" ] || { echo "缺少种子元数据 ${SMOKE_META_FILE}"; exit 1; }
          for u in "$SMOKE_DESIGNER_BASE" "$SMOKE_RUNTIME_BASE" "$SMOKE_ADMIN_BASE"; do
            curl -sf -m 5 "${u%/}/" >/dev/null || { echo "隔离栈入口不可达: $u"; exit 1; }
          done
          # tee 保留完整日志，但不吞退出码
          pnpm exec playwright test --config playwright.config.ts 2>&1 | tee /tmp/pw.log
          exit ${PIPESTATUS[0]}

      # 必跑场景核对（硬门禁）：缺报告 / 缺场景 / 跳过 / 失败 → job 变红
      - name: Verify Playwright required scenarios
        if: always()
        run: |
          set -uo pipefail
          REPORT="${{ github.workspace }}/schema-frontend/e2e-report.xml"
          REQUIRED="SMK-DES-01 SMK-RUN-01 SMK-ADM-01"
          FAIL=0

          if [ ! -f "$REPORT" ]; then
            echo "MISSING: e2e-report.xml（Playwright 未产出 JUnit 报告）"
            FAIL=1
          else
            for id in $REQUIRED; do
              if python3 - "$REPORT" "$id" <<'PY'
          import sys, xml.etree.ElementTree as ET
          report, target = sys.argv[1], sys.argv[2]
          root = ET.parse(report).getroot()
          for tc in root.iter('testcase'):
              if target in (tc.get('name') or ''):
                  if tc.find('skipped') is not None:
                      print('SKIPPED: %s' % target); sys.exit(1)
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      print('FAILED: %s' % target); sys.exit(1)
                  print('PASSED: %s' % target); sys.exit(0)
          print('NOT-FOUND: %s' % target); sys.exit(1)
          PY
              then
                :
              else
                FAIL=1
              fi
            done
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "必跑场景核对失败：报告缺失、场景缺失、跳过或失败"
            exit 1
          fi
          echo "Playwright 必跑场景全部通过"

      # 服务日志（诊断隔离栈启动问题：后端/预览/数据库都在这一步留痕）。
      # 启动失败时允许没有 JUnit，但 job 本身必然失败（见 Run Playwright 步骤）；
      # 这里 always() 保证失败现场仍可下载。
      - name: Archive service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-service-logs
          path: |
            /tmp/backend.log
            /tmp/preview-designer.log
            /tmp/preview-runtime.log
            /tmp/preview-admin.log
          if-no-files-found: warn
          retention-days: 14

      # Playwright 证据：
      # - e2e-report.xml（JUnit，核对步骤已消费）
      # - e2e-results/ 含失败截图与 trace（trace 仅失败保留）
      # - /tmp/pw.log 控制台全量输出
      # ⚠️ 明确排除 storageState / Cookie jar：trace 可能夹带请求与会话信息，
      #    只用隔离 CI 账号，且不归档任何会话状态文件。
      - name: Archive Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            schema-frontend/e2e-report.xml
            schema-frontend/e2e-results/
            /tmp/pw.log
          if-no-files-found: warn
          retention-days: 7