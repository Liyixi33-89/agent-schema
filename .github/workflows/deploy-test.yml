name: deploy-test

# 验收环境自动部署（test 分支）
#
# 分支模型：
#   feature/spec-* --PR--> test --PR--> master
#   · 合并到 test  → 自动部署到**验收面**（18081，schema_acceptance）
#   · 合并到 master → 生产发布仍走 deploy.yml（人工 workflow_dispatch + Environment 审批）
#
# 为什么 master 不自动发生产：
#   生产库与用户数据不可回滚到「随便一次 push」的程度；人工确认窗口是必要成本。
#   验收面是隔离库 + 隔离端口，自动部署风险可控，因此放开自动触发。
#
# 前置 Secrets（与本仓库 deploy.yml 相同，缺一即失败）：
#   SCHEMA_DEPLOY_SSH_KEY  deploy 账号私钥
#   SCHEMA_DEPLOY_HOST     deploy@111.231.57.177
#   SCHEMA_KNOWN_HOSTS     ssh-keyscan 输出
#
# ⚠️ 本工作流不做「静默跳过」：Secrets 缺失直接失败并给出配置指引，
#    不出现「绿了但没部署」的假成功。

on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的提交（留空 = 当前 test HEAD）'
        required: false
        default: ''

concurrency:
  group: deploy-test
  cancel-in-progress: false   # 验收面串行——避免两次部署交叉

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.chk.outputs.ready }}
    steps:
      - name: Check required secrets
        id: chk
        env:
          KEY: ${{ secrets.SCHEMA_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.SCHEMA_DEPLOY_HOST }}
          KNOWN: ${{ secrets.SCHEMA_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -z "$KEY" ]   && missing="$missing SCHEMA_DEPLOY_SSH_KEY"
          [ -z "$HOST" ]  && missing="$missing SCHEMA_DEPLOY_HOST"
          [ -z "$KNOWN" ] && missing="$missing SCHEMA_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Secrets:$missing"
            echo "配置方式（仓库 Settings → Secrets and variables → Actions）："
            echo "  SCHEMA_DEPLOY_SSH_KEY = deploy 账号私钥内容（ssh-keygen -t ed25519 生成）"
            echo "  SCHEMA_DEPLOY_HOST    = deploy@111.231.57.177"
            echo "  SCHEMA_KNOWN_HOSTS    = ssh-keyscan 111.231.57.177 的输出"
            echo "ready=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"
          echo "✅ Secrets 齐备"

  deploy-accept:
    needs: preflight
    if: needs.preflight.outputs.ready == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: acceptance   # 不设 Required reviewers（验收面可自动）
    permissions:
      contents: read
      actions: read

    # ⚠️ verify.ps1 -Level commit 的 backend-it 步骤要求真实 PG（门禁不可跳过）。
    #    缺这一步会报「PG 未就绪（localhost:5432）——集成测试门禁不可跳过」。
    #    与 verify.yml / smoke.yml 的服务定义保持一致。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: schema_dev
          POSTGRES_USER: schema_dev
          POSTGRES_PASSWORD: schema_local_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schema_dev -d schema_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve target commit
        id: ver
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "部署目标: $SHA"
          # 记录触发来源，便于追溯（自动 vs 手动）
          echo "触发事件: ${{ github.event_name }}  分支: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup toolchain
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ⚠️ 不要加 actions/setup-python：ubuntu-latest 自带 python3，
      #    setup-python 会改写 PATH/JAVA_HOME 相关环境，实测导致
      #    `[FAIL] backend-compile: mvn 退出码 1`（同一 commit 在 verify.yml 能过）。
      #    deploy.py 只要求 python3 可用，系统自带即可。

      - name: Install frontend dependencies
        working-directory: schema-frontend
        run: pnpm install --frozen-lockfile

      # ⚠️ 必须与 verify.yml 完全一致：RedlineVectorTest 会调 build-module/node 的
      #    NodeBuildWorker 执行共享向量，缺依赖会报
      #    「编译进程异常退出 code=1: node:internal/modules/package_json_reader」
      #    （package.json 存在但 esbuild 未装 → 4 个向量测试全红）。
      #    注意：该目录由 **package-lock.json** 管理（不是 pnpm），必须用 npm ci。
      - name: Install build-worker dependencies
        working-directory: schema-platform/build-module/node
        run: npm ci --no-fund --no-audit

      # 与人工发布同一条验证链：commit 级全绿才允许部署
      # 失败时把日志落到 artifact 并打印尾部，避免 `-q` 吞掉错误导致无法排查
      - name: Verify (commit level)
        shell: pwsh
        run: |
          try {
            ./scripts/verify.ps1 -Level commit 2>&1 | Tee-Object -FilePath verify.log
            if ($LASTEXITCODE -ne 0) { throw "verify 退出码 $LASTEXITCODE" }
          } catch {
            Write-Host "===== verify 失败，日志尾部 ====="
            if (Test-Path verify.log) { Get-Content verify.log -Tail 80 }
            throw
          }

      - name: Archive verify log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-test-verify-log
          path: verify.log
          if-no-files-found: warn
          retention-days: 7

      - name: Install deploy SSH key
        env:
          SSH_KEY: ${{ secrets.SCHEMA_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SCHEMA_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.SCHEMA_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # ⚠️ 用 Python 精确写入：bash 的 printf/cat <<< 都会额外附加换行，
          #    secret 本身已含尾随换行时会变成空行，OpenSSH 解析私钥失败
          #    → Permission denied (publickey)。这里 strip 后补单个换行。
          python3 - <<'PY'
          import os, pathlib
          home = pathlib.Path(os.path.expanduser("~")) / ".ssh"
          home.mkdir(parents=True, exist_ok=True)
          os.chmod(home, 0o700)

          key = os.environ["SSH_KEY"].strip()
          kh = os.environ["KNOWN_HOSTS"].strip()

          (home / "id_ed25519").write_text(key + "\n", encoding="utf-8")
          os.chmod(home / "id_ed25519", 0o600)
          (home / "known_hosts").write_text(kh + "\n", encoding="utf-8")
          os.chmod(home / "known_hosts", 0o644)

          # 自检：格式无效立刻失败，避免等到 ssh 阶段才报 publickey
          if "BEGIN" not in key or "PRIVATE KEY" not in key:
              raise SystemExit("::error::SCHEMA_DEPLOY_SSH_KEY 不是有效私钥（缺 BEGIN 标记）")
          if "END" not in key or "PRIVATE KEY" not in key:
              raise SystemExit("::error::SCHEMA_DEPLOY_SSH_KEY 被截断（缺 END 标记）")
          print(f"✅ 私钥已写入，行数={len(key.splitlines())}，known_hosts 行数={len(kh.splitlines())}")
          PY
          # 连通性自检：部署前必须能认证，避免构建 10 分钟后才发现认证失败
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_HOST" "echo 认证成功: \$(whoami)"
          echo "SCHEMA_DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "SCHEMA_DEPLOY_ROLE=deploy" >> "$GITHUB_ENV"
          # deploy.py 的 ssh 显式读取该路径（不依赖默认 ~/.ssh 路径差异）
          echo "SCHEMA_DEPLOY_KEY_PATH=$HOME/.ssh/id_ed25519" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 部署（方案 B：前端自动 / 后端人工）
      #
      # 实测数据（决定这个策略）：
      #   · CI runner → 服务器：约 10 KB/s
      #   · 服务器 → 境内镜像：113 MB/s（快）
      #   · 服务器 → GitHub：40 KB/s（慢）
      # 即：**境外↔服务器这段链路是硬瓶颈**，任何协议都无法突破
      #   （scp / rsync / 管道 / GitHub artifact 拉取均已实测）。
      #
      # 传输量算账（按 10 KB/s）：
      #   · web.tar.gz    1.87 MB → 约 3 分钟   ✅ 可行
      #   · backend.tar  34.5 MB → 约 57 分钟  ❌ 超 job 上限
      #
      # 因此：
      #   · 只改前端 → 自动部署 web（复用服务器现有 jar）
      #   · 改了后端 → 明确失败并给出人工部署命令（不静默跳过、不假成功）
      # ---------------------------------------------------------------
      - name: Detect backend changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -u
          # 判断本次是否动了后端/共享协议（会影响 jar 的路径）
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "无法比较基线（首次推送/手动触发）→ 保守视为后端有变更"
            echo "backend=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || echo "")
          echo "变更文件数: $(printf '%s\n' "$CHANGED" | grep -c . || echo 0)"
          if printf '%s\n' "$CHANGED" | grep -qE '^schema-platform/|^pom\.xml$|^schema-frontend/packages/schema-protocol/'; then
            echo "backend=yes" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$CHANGED" | grep -E '^schema-platform/|^pom\.xml$|^schema-frontend/packages/schema-protocol/' | head -5 | sed 's/^/  后端相关: /'
          else
            echo "backend=no" >> "$GITHUB_OUTPUT"
            echo "  仅前端变更 → 只需部署 web"
          fi

      - name: Deploy to acceptance
        run: |
          set -u
          if [ "${{ steps.scope.outputs.backend }}" = "yes" ]; then
            echo "::error title=后端变更需人工部署::本次提交改了 schema-platform / pom.xml / schema-protocol"
            echo ""
            echo "CI 无法自动部署后端（实测 CI→服务器仅 10 KB/s，34.5MB jar 需约 57 分钟，超 job 上限）。"
            echo ""
            echo "请在有服务器直连的机器上执行（实测 6 秒完成）："
            echo "  export SCHEMA_DEPLOY_HOST=deploy@111.231.57.177"
            echo "  export SCHEMA_DEPLOY_ROLE=deploy"
            echo "  export SCHEMA_DEPLOY_KEY_PATH=~/.ssh/id_ed25519"
            echo "  python scripts/deploy.py --version ${{ steps.ver.outputs.short }} --target accept --skip-verify"
            echo ""
            echo "前端产物已在本次 CI 构建完成，人工部署会一并发布前后端。"
            exit 1
          fi
          # 仅前端：复用服务器现有 jar
          SCHEMA_SKIP_BACKEND=1 python scripts/deploy.py \
            --version "${{ steps.ver.outputs.short }}" \
            --target accept \
            --skip-verify
        # --skip-verify：上一步已跑过，避免重复 3 分钟

      # 部署后独立复验（不信任部署脚本自身的结论）
      - name: Post-deploy verification
        env:
          HOST: ${{ secrets.SCHEMA_DEPLOY_HOST }}
        run: |
          set -u
          SSH_HOST="${HOST#*@}"
          echo "=== 三入口（经 nginx，真实用户路径）==="
          FAIL=0
          for p in /accept/designer/ /accept/runtime/ /accept/admin/; do
            code=$(ssh -o BatchMode=yes "$HOST" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1$p")
            echo "  $p -> $code"
            [ "$code" = "200" ] || FAIL=1
          done

          echo "=== 就绪探针 commit 一致性 ==="
          PROBE=$(ssh -o BatchMode=yes "$HOST" "curl -s http://127.0.0.1:18081/internal/health/readiness")
          echo "  $PROBE"
          COMMIT=$(printf '%s' "$PROBE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")
          TARGET="${{ steps.ver.outputs.sha }}"
          if [ "$COMMIT" != "$TARGET" ]; then
            echo "::error::探针 commit=$COMMIT 与目标 $TARGET 不一致"
            FAIL=1
          fi

          echo "=== 版本元数据一致性（VERSION.txt vs 实际 jar）==="
          ssh -o BatchMode=yes "$HOST" '
            R=$(readlink -f /opt/schema/staging/accept/current)
            A=$(sha256sum "$R/schema-platform.jar" | cut -d" " -f1)
            V=$(grep "^jarSha256=" "$R/VERSION.txt" 2>/dev/null | cut -d= -f2)
            C=$(grep "^commit=" "$R/VERSION.txt" 2>/dev/null | cut -d= -f2)
            echo "  版本目录: $R"
            echo "  实际 jar: $A"
            echo "  VERSION : $V (commit=$C)"
            if [ "$A" != "$V" ]; then echo "METADATA_MISMATCH"; fi
          ' | tee /tmp/meta.txt
          grep -q METADATA_MISMATCH /tmp/meta.txt && { echo "::error::VERSION.txt 与 jar 不一致"; FAIL=1; }

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::部署后验证失败"
            exit 1
          fi
          echo "✅ 验收面部署验证通过"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 验收面部署结果"
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 结果 | ${{ job.status }} |"
            echo "| commit | \`${{ steps.ver.outputs.sha }}\` |"
            echo "| 触发 | ${{ github.event_name }} (\`${{ github.ref_name }}\`) |"
            echo "| 操作人 | ${{ github.actor }} |"
            echo "| 入口 | /accept/designer/ · /accept/runtime/ · /accept/admin/ |"
          } >> "$GITHUB_STEP_SUMMARY"